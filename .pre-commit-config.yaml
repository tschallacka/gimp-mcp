repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: local
    hooks:
      - id: capabilities-current
        name: docs/CAPABILITIES.md matches the tools
        entry: python3 tools/gen_capabilities.py --check
        language: system
        pass_filenames: false
        files: ^(gimp_mcp_server\.py|gimp-mcp-plugin\.py|tools/gen_capabilities\.py)$
